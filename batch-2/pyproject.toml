[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-report-review-tool"
version = "0.1.0"
description = "Role-based NiceGUI dashboard for QC report automation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy[asyncio]>=2.0,<3",
    "alembic>=1.18,<2",
    "asyncpg>=0.30,<1",
    "aiohttp>=3.14.3,<4",
    "cryptography>=50.0,<51",
    "msal>=1.28,<2",
    "nicegui>=2.0,<4",
    "openpyxl>=3.1,<4",
    "pydantic>=2.7,<3",
    "python-docx>=1.1,<2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20,<1",
    "bandit>=1.8,<2",
    "mypy>=1.10,<2",
    "pip-audit>=2.10,<3",
    "pytest>=8.2,<10",
    "ruff>=0.5,<1",
]
migration = [
    "aiosqlite>=0.20,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
main_file = "app/main.py"
markers = [
    "postgres: requires QC_POSTGRES_TEST_URL and a dedicated PostgreSQL test database",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["app.py", "app_v2.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["app"]
exclude = ["app.py", "app_v2.py"]

[[tool.mypy.overrides]]
module = "msal"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["docx", "docx.*", "openpyxl", "openpyxl.*"]
ignore_missing_imports = true
